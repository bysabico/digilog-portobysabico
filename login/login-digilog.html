<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PAGE DIGILOG</title>

    <!-- Link google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Lilita+One&family=Oxanium:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Link CDN Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Link CSS bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <!-- link unsplash -->
    <link rel="unsplash" href="https://source.unsplash.com/random">

    <!-- LINK CSS Style -->
    <link rel="stylesheet" href="../login/login-digilog-style.css">
</head>
<body class="bg-light overflow-hidden">

  <!-- transisi login to main page digilog: animasi gerbang buka kanan-kiri -->
  <div class="gerbang-container">
    <div class="gerbang-kiri position-fixed" id="gerbang-kiri"></div>
    <div class="gerbang-kanan position-fixed" id="gerbang-kanan"></div>
  </div>


  <div class="container d-flex align-items-center justify-content-center min-vh-100 animasi-login">
    <div class="card p-4 w-100" id="login-page">

      <!-- header login, pakai label biar kalau user klik bisa lgsg mengarah ke input box -->
      <label for="username" class="text-center">
        <h2 class="my-3 fs-1">HALO! 👋</h2>
      </label>

      <div class="username-input mb-3 my-2">

        <!-- login pakai namaa [input text] -->
        <input type="text" name="" id="username" class="form-control text-center fs-5 p-3" placeholder="Siapa namanyaa? (˶ˆᗜˆ˵)" required>

        <!-- login secara anonim [input checkbox] -->
        <div class="form-check mb-2 my-4">
          <label for="anon-checkbox" class="form-check-label custom-checkbox d-flex w-100">
            <input type="checkbox" name="" class="form-check-input me-2" id="anon-checkbox">
            Login as Anonim
          </label>
        </div>

        <!-- remember me checkbox~ -->
        <div class="form-check">
          <label for="remember-me" class="form-check-label custom-checkbox d-flex w-100">
            <input type="checkbox" name="" class="form-check-input me-2" id="remember-me">
            Remember me
          </label>
        </div>

        <!-- .text-end = biar button di sebelah kanan -->
        <div class="text-end mt-3">

          <!-- btn login -->
          <button type="button" class="btn btn-primary" id="send-btn">
            Login <i class="fa-solid fa-right-to-bracket"></i>
          </button>
        </div>

        <!-- alert/peringatan untuk user agar mengisi username -->
        <div class="alert-overlay position-fixed d-flex justify-content-center align-items-center" id="custom-alert">
          <div class="alert-box">
            <p id="alert-message">
              <!-- pesan user untuk isi username/klik checkbox anonim -->
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- footer login -->
    <footer class="footer-container fs-4 text-end me-1 pe-3" data-bs-toggle="modal" data-bs-target="#login-digilog-footer" hidden>
      <p class="opacity-75"> &copy; bysabico </p>
    </footer>
  </div>

  <div class="modal fade p-5" id="login-digilog-footer">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3">
        <div class="modal-header">
          <h1>HI</h1>
        </div>
        <div class="modal-body text-center">
          <p>
            Ini login-page digilog bysabico.
            <br> 
            Digilog adalah website jam digital-analog.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- script -->
  <!-- link js bootstrap-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

  <!-- js login-digilog -->
  <script src="../login/login-digilog-logic.js"></script>
</body>
</html>
