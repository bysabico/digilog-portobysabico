<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATE-TIME FOR FITUR</title>

    <!-- Link CSS bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <!-- LINK CSS Style -->
    <link rel="stylesheet" href="/reusable-comp/date-time-for-fitur/date-time.css">
</head>
<body>
    <!-- header bagian paling atas, emg niatnya gini, ga full stopwatch dilayar. 
         biar mempermudah juga cek jam dan tanggal tinggal liat ke atas akak-->

        <!-- pakai d-flex biar flexible dan column biar flexnya menyesuaikan lebar layar~ -->
        <header class="d-flex flex-row justify-content-between align-items-stretch my-5 date-time">
            
            <!-- HARI - TANGGAL -->
            <div class="dateDisplay fs-5 text-center custom-stopwatch" id="date">DD:MM:YYYY</div>

            <!-- JAM DIGITAL NAMPILIN WAKTU REAL TIME -->
            <div class="display-1 timeDisplay text-center fs-5 custom-stopwatch" id="digitalClock">00:00:00</div>

        </header>

    <!-- Link JS bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!-- LINK JS -->
    <script type="module" src="/reusable-comp/date-time-for-fitur/date-time.js"></script>
</body>
</html>
