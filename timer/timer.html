<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGI TIMER</title>

    <title>DIGILOG STOPWATCH</title>

    <!-- Link google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Lilita+One&family=Oxanium:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Link CDN Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Link CSS bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <!-- LINK CSS Style -->
    <link rel="stylesheet" href="../navbar-fitur/navbar-fitur-digilog-style.css">
    <link rel="stylesheet" href="../reusable-comp/date-time-for-fitur/date-time.css">
    <link rel="stylesheet" href="../footer/footer-digilog-style.css">
    <link rel="stylesheet" href="../timer/timer.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-light overflow-x-hidden">
    
    <!-- navbar -->
    <div id="navbar-container">
        <!-- space buat navbar -->
    </div>

    <div class="container-fluid flex-grow-1 m-auto p-5 text-center">

        <div id="date-time-container">
            <!-- space date time -->
        </div>

        <!-- TIMER -->
        <div class="flex-column justify-content-center align-items-center mx-3 mt-md-5">

            <div id="inputs-section">
                <!-- INPUT MODE TIMER -->
                <div class="btn-group w-100 mt-2 mb-3 mode-toggle" role="group">
                    <input type="radio" id="mode-timer-biasa" class="btn-check" name="mode-radio" checked>
                    <label for="mode-timer-biasa" class="btn btn-outline-light"> TIMER </label>
                    
                    <input type="radio" id="mode-timer-pomodoro" class="btn-check" name="mode-radio">
                    <label for="mode-timer-pomodoro" class="btn btn-outline-light"> POMODORO </label>
                </div>

                <!-- TITLE STOPWATCH -->
                <h1 class="text-center fs-2 mt-4 mb-3 custom-timer" id="timer-title" data-bs-toggle="modal" data-bs-target="#deskripsiModalDigiStopwatch" id='timerTitle'>TIMER</h1>

                <!-- INPUT NAMA TIMER -->
                <div class="nama-timer mb-5">
                    <label class="form-label costume-style-timer" for="input-nama-timer" id="input-nama-sesi">NAMA TIMER</label>
                    <input type="text" id="input-nama-timer" class="form-control" placeholder="Meeting, Belajar, dan lainnya...">
                </div>

                <!-- INPUT DURASI MODE BIASA -->
                <div class="mode-panel mb-4" id="section-mode-biasa">
                    <label class="form-label costume-style-timer" for="durasi-detik">Durasi Timer</label>
                    <div class="d-flex align-items-center gap-2">
                        <input type="number" id="durasi-jam-timer-biasa" class="form-control text-center costume-durasi" min="0" max="23" placeholder="HH">
                        <span>:</span>
                        <input type="number" id="durasi-menit-timer-biasa" class="form-control text-center costume-durasi" min="0" max="59" placeholder="MM">
                        <span>:</span>
                        <input type="number" id="durasi-detik-timer-biasa" class="form-control text-center costume-durasi" min="0" max="59" placeholder="SS">
                    </div>
                </div>

                <!-- INPUT DURASI MODE POMODORO -->
                <div class="mode-panel mb-4 d-none" id="section-mode-pomodoro">

                    <!-- BUNGKUS POMODORO SETTING -->
                    <button type="button" id="toggle-setting-pomodoro-btn" class="btn btn-outline-light btn-sm w-100 d-flex justify-content-between align-items-center mb-3">
                        <span>POMODORO SETTING</span>
                        <span>
                            <i id="toggle-setting-pomodoro-icon" class="fa-solid fa-caret-up"></i>
                        </span>
                    </button>

                    <div id="pomodoro-settings">

                        <!-- INPUT FOKUS -->
                        <div class="mb-3">
                            <label for="" class="form-label fw-bold fs-5">FOKUS</label>
                            <div class="d-flex align-items-center gap-2">
                                <input type="number" name="" id="jam-pomodoro" class="form-control form-control-lg text-center costume-durasi" value='0' min="0" max="23" placeholder="HH">
                                <span>:</span>
                                <input type="number" name="" id="menit-pomodoro" class="form-control form-control-lg text-center costume-durasi" value='25' min="0" max="59" placeholder="MM">
                                <span>:</span>
                                <input type="number" name="" id="detik-pomodoro" class="form-control form-control-lg text-center costume-durasi" value='0' min="0" max="59" placeholder="SS">
                            </div>
                        </div>

                        <!-- INPUT ISTIRAHAT -->
                        <div class="mb-3">
                            <label for="" class="form-label fw-bold text-warning-emphasis fs-5">ISTIRAHAT</label>
                            <div class="d-flex align-items-center gap-2">
                                <input type="number" name="" id="jam-istirahat" class="form-control form-control-sm text-center costume-durasi" value='0' min="0" max="23" placeholder="HH">
                                <span>:</span>
                                <input type="number" name="" id="menit-istirahat" class="form-control form-control-sm text-center costume-durasi" value='5' min="0" max="59" placeholder="MM">
                                <span>:</span>
                                <input type="number" name="" id="detik-istirahat" class="form-control form-control-sm text-center costume-durasi" value='0' min="0" max="59" placeholder="SS">
                            </div>
                        </div>

                        <!-- INPUT JUMLAH PENGULANGAN -->
                        <div class="row g-2">
                            <div class="col-12">

                                <!-- TARGET -->
                                <label for="" class="form-label">Jumlah Pengulangan</label>
                                <div class="input-group mb-2">
                                    <input type="number" name="" id="jumlah-pengulangan" class="form-control" placeholder="1">
                                </div>

                                <!-- TAK TERBATAS -->
                                <div class="form-check">
                                    <input type="checkbox" name="" id="unlimited-pengulangan" class="form-check-input">
                                    <label for="unlimited-pengulangan" class="form-check-label">Pengulangan Tanpa Batas</label>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- TAMPILAN TIMER -->
            <div class="d-none text-center py-2" id="running-timer">
                <div class="timer-name-badge" id="running-timer-name">
                    <!-- UNTUK MENAMPILKAN NAMA TIMER -->
                </div>

                <div class="timer-mode-label" id="running-mode-label">
                    <!-- UNTUK MENAMPILKAN MODE TIMER -->
                </div>

                <!-- TIMER -->
                <h1 class="mt-5 mx-auto w-100" id="display-timer"> 00:00:00 </h1>

                <!-- PROGRESS BAR -->
                <div class="progress mb-3">
                    <div id="progress-bar" class="progress-bar" role="progressbar">
                        <!-- UNTUK MENAMPILKAN PROGRESS BAR TIMER -->
                    </div>
                </div> 
            </div>

            <!-- BTN TIMER -->
            <div class="d-flex flex-row justify-content-center gap-2 gap-md-4 mt-4 custom-timer" id="btn-timer">

                <!-- tombol start -->
                <button class="btn fs-4 btn-success w-md-auto btn-timer-costume w-100" id="startBtn">
                    <i class="fa-solid fa-play d-inline d-md-none"></i>
                    <span class="d-none d-md-inline">START</span>
                </button>

                <!-- tombol pause -->
                <button class="btn fs-4 btn-warning d-none p-2 w-md-auto btn-timer-costume w-50" id="pauseBtn">
                    <i class="fa-solid fa-pause d-inline d-md-none"></i>
                    <span class="d-none d-md-inline">PAUSE</span>
                </button>

                <!-- tombol reset -->
                <button class="btn fs-4 btn-danger p-2 w-md-auto btn-timer-costume d-none w-50" id="resetBtn">
                    <i class="fa-solid fa-redo d-inline d-md-none"></i>
                    <span class="d-none d-md-inline">RESET</span>
                </button>
            </div>

            <!-- NOTE AWAL -->
            <p id="status-text" class="text-center mt-3 text-secondary small"> Isi durasi terlebih dahulu ya.</p>

            <hr class="section-divider d-none" id="section-divider">

            <!-- Report timer harian -->
            <div class="card-dark d-none" id='header-report'>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">
                        Pemakaian Hari Ini 

                        <span class="badge bg-info ms-2" id="total-timer-badge" role="button" data-bs-toggle="modal" data-bs-target="#breakdown-modal">0 sesi</span>
                    </h5>
                </div>
            </div>

            <!-- loading -->
            <!-- <div class="empty-state" id="loading-state">
                <div class="spinner-border spinner-border-sm text-info me-2" role="status"></div>
                Memuat data. . .
            </div> -->

            <!-- hasil timer -->
            <div class="empty-state d-none" id="results-empty">
                Belum ada timer yang dijalankan hari ini.
            </div>

            <!-- tabel hasil timer harian -->
            <div class="table-responsive d-none" id="results-timer-table">
                <table class="table table-sm align-middle">

                    <!-- HEADER TABLE -->
                    <thead>
                        <tr>
                            <th>NO</th>
                            <th>SESI</th>
                            <th class="d-none d-md-table-cell">MODE</th>
                            <th class="d-none d-md-table-cell">PENGULANGAN</th>
                            <th class="d-none d-md-table-cell">TARGET</th>
                            <th>EKSEKUSI</th>
                            <th>STATUS</th>
                            <th class="d-none d-md-table-cell">START</th>
                        </tr>
                    </thead>

                    <tbody id="hasil-timer">
                        <!-- ISI HASIL TIMER -->
                    </tbody>
                </table>
            </div>

            <!-- note untuk pengguna -->
            <p class="session-note mt-2 mb-0 d-none" id="save-note">
                <!-- Data tersimpan otomatis dalam harian. -->
            </p>
        </div>
    </div>

    <div id="footer-container"></div>

    <!-- MODAL TRIGGER PENGISIAN TIMER -->
    <div class="modal" id="trigger-modal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <!-- HEADER MODAL -->
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">
                        <i class="fa-solid fa-triangle-exclamation"></i> 
                        PERHATIAN
                    </h5>
                    <button type="button" class="btn-close btn-close-white" id="trigger-modal-close-x"></button>
                </div>

                <!-- PESAN MODAL -->
                <div class="modal-body mt-2 mb-2" id="trigger-modal-body">
                    <!-- isi pesan trigger -->
                </div>

                <!-- FOOTER MODAL -->
                <div class="modal-footer border-secondary flex-column align-items-stretch p-0">

                    <!-- PESAN AUTO CLOSE DAN HITUNG MUNDUR DALAM DETIK -->
                    <div class="d-flex justify-content-between align-items-center px-3 py-1">
                        <span class="small text-secondary">
                            Otomatis tertutup dalam <span id="countdown-trigger-modal">10</span> detik
                        </span>

                        <!-- BTN CLOSE MANUAL -->
                        <button type="button" class="btn btn-info btn-sm" id="modal-close-btn">Oke</button>
                    </div>

                    <!-- PROGRESS BAR HITUNG MUNDUR AUTO CLOSE TRIGGER MODAL -->
                    <div class="progress" id="progress-bar-auto-close-trigger">
                        <div id="auto-close-bar" class="progress-bar bg-info" role="progressbar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL BREAKDOWN TOTAL TIMER -->
    <div class="modal" id="breakdown-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Ringkasan Timer Hari Ini</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span>Total Sesi</span>
                        <span class="badge bg-info fs-6" id="breakdown-total">0</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span>Selesai</span>
                        <span class="badge badge-status-selesai fs-6" id="breakdown-selesai">0</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <span>Direset</span>
                        <span class="badge badge-status-reset fs-6" id="breakdown-reset">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link JS bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <!-- nav-fitur js -->
    <script src="../navbar-fitur/navbar-fitur-digilog-logic.js"></script>

    <!-- date-time js -->
    <script src="../reusable-comp/date-time-for-fitur/date-time.js"></script>

    <!-- footer js -->
    <script src="../footer/footer-digilog-logic.js"></script>

    <!-- stopwatch js -->
    <script src="../timer/timer.js"></script>

    <!-- coming soon js -->
    <script src="../reusable-comp/coming-soon-modal/coming-soon-modal.js"></script>
</body>
</html>
